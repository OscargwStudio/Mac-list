name: Build & Deploy Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    # 每周一 11:00 (UTC+8) 重建一次；可删掉这一段改为只在 push 时构建
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 源 Markdown 就在仓库根目录，直接就地构建，无需额外 clone
      - name: Generate static site
        run: python3 build.py --source .
      - uses: actions/configure-pages@v5
        with:
          # 首次在 fork 上运行时自动启用 Pages（需要 pages: write 权限）
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
